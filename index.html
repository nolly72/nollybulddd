<!DOCTYPE html>
<html lang="ru">
<head>

    <!-- Шрифты: Manrope (жирный) и Playfair Display (элегантная антиква) -->

    <link href="https://unpkg.com" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
