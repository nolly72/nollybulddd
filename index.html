<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nolly Building | Premium Architecture</title>
    
    <!-- Премиальный шрифт: Jost (чистый, современный) и Marcellus (антиква для акцентов) -->
    <link href="https://fonts.googleapis.com" rel="stylesheet">
    <link href="https://unpkg.com" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Навигация без логотипа -->
    <nav class="navbar" data-aos="fade-down">
        <div class="nav-center">
            <a href="#projects">Объекты</a>
            <a href="#calc">Расчет</a>
            <a href="#constructor">Конструктор</a>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-content" data-aos="zoom-out" data-aos-duration="2500">
            <h1 class="main-title">Nolly Building</h1>
            <p class="subtitle">Архитектура, рожденная <i>тишиной леса</i></p>
            <div class="scroll-badge">Scroll to explore</div>
        </div>
    </section>

    <!-- Секция с проектами (Мягкие формы) -->
    <section id="projects" class="projects">
        <div class="container">
            <h2 class="section-title" data-aos="fade-up">Наши резиденции</h2>
            <div class="project-card" data-aos="fade-up">
                <div class="card-image-wrap">
                    <img src="https://images.unsplash.com" alt="House">
                </div>
                <div class="card-info">
                    <h3>Pine Valley</h3>
                    <p>Слияние камня и дерева</p>
                </div>
            </div>
        </div>
    </section>

    <!-- Скрипты для плавного скролла -->
    <script src="https://unpkg.com"></script>
    <script src="https://unpkg.com"></script>
    <script src="js/main.js"></script>
</body>
</html>
