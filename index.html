<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nolly Building | Эстетика загородной жизни</title>
    
    <!-- Шрифты -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-links">
                <a href="#catalog">Дома</a>
                <a href="#philosophy">Философия</a>
                <a href="#calc">Ипотека</a>
                <a href="#constructor">Конструктор</a>
            </div>
        </div>
    </nav>

    <header class="hero">
        <h1 class="main-title">Nolly Building</h1>
        <p class="hero-sub">Премиальные резиденции от 10 млн ₽</p>
        <a href="#constructor" class="btn-main">Создать свой дом</a>
    </header>

    <section id="catalog" class="section">
        <h2 class="section-title">Коллекция резиденций</h2>
        <div class="grid-houses" id="house-list"></div>
    </section>

    <section id="calc" class="section">
        <div class="card-light">
            <h2>Ипотечный расчет</h2>
            <div class="calc-grid">
                <div class="inputs">
                    <label>Цена: <span id="priceLabel">15.0</span> млн ₽</label>
                    <input type="range" id="priceRange" min="10" max="50" step="0.5" value="15">
                    <label>Взнос: <span id="initialLabel">3.0</span> млн ₽</label>
                    <input type="range" id="initialRange" min="1" max="20" step="0.5" value="3">
                </div>
                <div class="result">
                    <p>Ежемесячный платеж</p>
                    <h3 id="monthlyResult">84 500 ₽</h3>
                </div>
            </div>
        </div>
    </section>

    <!-- Подключаем логику -->
    <script src="script.js"></script>
</body>
</html>
